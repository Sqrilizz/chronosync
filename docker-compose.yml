services:
  chronosync:
    build: .
    container_name: chronosync
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=sqlite:///data/chronosync.db?mode=rwc
      - APP_URL=http://localhost:8080
      # Optional: GitHub OAuth (not required)
      # - GITHUB_CLIENT_ID=
      # - GITHUB_CLIENT_SECRET=
